name: Preview Dashboard
on:
  workflow_dispatch:
  push:
    branches:
      - preview-20260830-dashboard-fixes
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
